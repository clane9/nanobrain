# Name of the run. Used for output directory suffix and wandb.
name: nanobrain

# Description of the run. Goes in wandb notes.
notes: null

# Root output directory. The run writes to <output_dir>/<name> when name is set.
output_dir: output

# Data.
train_filelist: src/nanobrain/config/fomo300k_images.txt
num_workers: 8
prefetch_factor: 2

# Fixed 1mm grid that all images are fit to.
grid_size: [192, 240, 192]
target_spacing: 1.0
patch_size: 8

# Views. ~3200 brain mask patches per image on average. The student encodes num_student
# tokens, the EMA teacher num_teacher, num_overlap of them shared. The loss covers every teacher
# token, seen by the student or not. Samplers: random, mask_unit (adds unit_size).
views:
  name: random
  num_student: 512
  num_teacher: 1536
  num_overlap: 256
  # min fraction of in-mask voxels for a patch to be sampled
  min_mask_frac: 0.25
num_samples: 2
# loss weight of teacher positions the student also sees (unseen positions weigh 1)
seen_weight: 1.0

# Photometric augmentation per view, a list of {name, p, **kwargs}. Names: gamma
# (max_log_gamma), bias_field (strength, num_freqs), scale_shift (max_log_scale, max_shift),
# noise (max_std). Empty list disables. e.g.
#   - {name: bias_field, p: 0.5, strength: 0.2}
student_augment: []
teacher_augment: []

# Model: jepa (smooth l1 to layer-normed teacher tokens, I-JEPA) or prototype_ce (prototype
# cross entropy, iBOT / DINOv2 / JEM). prototype_ce also takes head_kwargs (num_prototypes,
# num_layers, hidden_dim, bottleneck_dim), student_temp, teacher_temp, teacher_balance
# (softmax, center, sinkhorn), center_momentum, entropy_weight.
model: jepa
model_kwargs:
  # ViT-B
  encoder_kwargs:
    depth: 12
    embed_dim: 768
    num_heads: 12
    class_tokens: 0
    drop_path_rate: 0.0
    # learned_sep, sincos, rope_axial
    pos_embed: learned_sep
  predictor_kwargs:
    depth: 4
    predictor_dim: 512
    num_heads: 8
    # self_attn (MAE / I-JEPA) or cross_attn (CAPI)
    attn_type: self_attn

# EMA teacher momentum, linear from ema_momentum to ema_momentum_end, constant if null.
ema_momentum: 0.996
ema_momentum_end: null

# Optimization. batch_size is images per step; each gives num_samples sequences.
batch_size: 32
accum_iter: 1

base_lr: 1e-3
lr: null
min_lr: 1e-6
# Total wall time limit in minutes. null runs the full total_steps.
# ~30K steps take ~1 hr on one H100.
time_limit: null
total_steps: 30000
warmup_steps: 2000
decay_steps: 0
weight_decay: 0.05
betas: [0.9, 0.95]
clip_grad: 1.0
fused_adamw: true

amp: true
amp_dtype: bfloat16
compile: true

# Checkpointing. checkpoint-last.pth is overwritten every checkpoint_period steps and at the end.
# checkpoint_steps lists steps to also keep as numbered checkpoints.
# checkpoint_minutes lists times to also keep as eg checkpoint-60min.pth.
ckpt: null
resume: false
auto_resume: true
checkpoint_period: 2500
checkpoint_steps: null
checkpoint_minutes: null

# Logging. Teacher feature pca of plot_num_images images every plot_period steps.
print_freq: 100
plot_period: 5000
plot_num_images: 4

device: cuda
seed: 7338
debug: false

wandb: false
wandb_entity: null
wandb_project: nanobrain

# Name of the run. Used for output directory suffix and wandb.
name: nanobrain

# Description of the run. Goes in wandb notes.
notes: null

# Root output directory. The run writes to <output_dir>/<name> when name is set.
output_dir: output

# Data.
train_filelist: src/nanobrain/config/fomo300k_images.txt
num_workers: 8
prefetch_factor: 2
clip_quantiles: [0.005, 0.995]

# Fixed 1mm grid that all images are fit to.
grid_size: [192, 240, 192]
target_spacing: 1.0
patch_size: 8

# Mask sampling. ~3200 brain mask patches per image on average, so num_visible 512 is a
# ~0.84 mask ratio.
num_visible: 512
num_predict: 1024
num_samples: 2
# Samplers:
#   - uniform: uniform random sampling
#   - mask_unit: units of mask_unit_size^3 patches (pixio, hiera)
# null defaults to uniform.
mask_sampler: null
mask_unit_size: 2

# Model (ViT-B encoder).
model_kwargs:
  depth: 12
  embed_dim: 768
  num_heads: 12
  decoder_depth: 4
  decoder_embed_dim: 512
  decoder_num_heads: 8
  class_tokens: 0
  drop_path_rate: 0.0
  # min fraction of in-mask voxels for a patch to be sampled in training
  min_mask_frac: 0.25
  # learned_sep, learned_full, sincos, none, rope_axial, rope_mixed
  pos_embed: learned_sep

# Optimization. batch_size is images per step; each gives num_samples sequences.
batch_size: 32
accum_iter: 1

base_lr: 1e-3
lr: null
min_lr: 1e-6
# Total wall time limit in minutes. null runs the full total_steps.
# ~30K steps take ~1 hr on one H100.
time_limit: null
total_steps: 30000
warmup_steps: 2000
decay_steps: 0
weight_decay: 0.05
betas: [0.9, 0.95]
clip_grad: 1.0
fused_adamw: true

amp: true
amp_dtype: bfloat16
compile: true

# Checkpointing. checkpoint-last.pth is overwritten every checkpoint_period steps and at the end.
# checkpoint_steps lists steps to also keep as numbered checkpoints.
# checkpoint_minutes lists times to also keep as eg checkpoint-60min.pth.
ckpt: null
resume: false
auto_resume: true
checkpoint_period: 2500
checkpoint_steps: null
checkpoint_minutes: null

# Logging.
print_freq: 100
plot_period: 5000
plot_nrow: 4
plot_ncol: 2
# Number of patches to predict for plotting. null predicts all unseen mask patches.
plot_num_predict: null

device: cuda
seed: 7338
debug: false

wandb: false
wandb_entity: null
wandb_project: nanobrain
